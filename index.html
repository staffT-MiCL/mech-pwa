<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>重装機体</title>
<meta name="theme-color" content="#0a0c0b">
<meta name="description" content="PS初期風の3Dロボアクション。パーツを組み替えて演習場で戦う">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style>

<style>
/* ガレージ：スマホ横画面を基準に左右2分割（左＝機体と性能、右＝情報パネル）／出撃：3D画面いっぱいに操作UI
   方向性：SF計器盤×ミリタリー（ステンシル文字、オリーブ、警告帯、製造番号）×初代PS風の低解像度 */
:root{
 --bg:#07090a; --panel:#0e1211; --panel2:#121816; --line:#2c3833; --fg:#d9e0dc; --dim:#7f8c86; --faint:#4a5550;
 --accent:#8cf06e; --fire:#f0a040; --cyan:#6fd3e0; --alert:#ff5a3c; --olive:#5b6b3a; --khaki:#b8a878;
 --disp:"DotGothic16","MS Gothic",monospace; --mech:"Chakra Petch","DotGothic16",monospace; --sten:"Stardos Stencil","Chakra Petch",monospace;
 --body:"M PLUS 1p","Hiragino Sans",sans-serif;
 color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mech);overscroll-behavior:none}
button{font-family:var(--mech);font-size:13px;background:#1a201d;color:var(--fg);border:1px solid var(--line);border-radius:0;padding:6px 11px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
.cut{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:40px minmax(0,1fr)}
#app.play{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#app.play #hdr,#app.play #side{display:none}
@media (orientation:portrait){#app:not(.play){grid-template-columns:minmax(0,1fr);grid-template-rows:40px 52% minmax(0,1fr)}}

/* ヘッダー */
#hdr{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;background:#101513;border-bottom:1px solid var(--line);position:relative;min-width:0}
#hdr::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:4px;background:linear-gradient(var(--olive),var(--olive)) 0 0/100% 1px no-repeat,repeating-linear-gradient(90deg,var(--khaki) 0 1px,transparent 1px 16px) 0 1px/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--khaki) 0 2px,transparent 2px 80px) 0 0/100% 4px no-repeat;opacity:.6;pointer-events:none;z-index:4}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo .jp{font-family:var(--disp);font-size:17px;color:#eef2ef;letter-spacing:2px}
.logo .en{font-family:var(--sten);font-size:13px;color:var(--fire);letter-spacing:3px}
.sep{width:1px;height:18px;background:var(--line)}
.tag{font-family:var(--sten);font-size:12px;color:var(--khaki);letter-spacing:2px;white-space:nowrap}
#uname{min-width:0;width:11em;background:transparent;border:0;border-bottom:1px dashed var(--faint);color:var(--fg);font-family:var(--disp);font-size:13px;padding:2px 2px}
.grow{flex:1}
.kv{display:flex;align-items:baseline;gap:5px;white-space:nowrap}.kv small{font-size:10px;color:var(--dim);letter-spacing:1px}.kv b{font-size:13px;font-variant-numeric:tabular-nums}
.kv b.over{color:var(--alert)}
#menuBtn{height:28px;padding:0 14px;display:flex;align-items:center;gap:8px;background:#1c1409;border:1px solid var(--fire);color:var(--fire);font-size:12px;font-weight:700;letter-spacing:3px}
@media (max-width:700px){.kv:first-of-type,.tag{display:none}}

/* 3D画面 */
#wrap{position:relative;min-height:0;min-width:0;background:#000;overflow:hidden;touch-action:none;border-right:1px solid var(--line)}
#wrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px)}
#err{position:absolute;inset:auto 16px 16px 16px;color:#ffb0a0;font-size:13px;z-index:5}

/* ガレージの重ね表示 */
#gui{position:absolute;inset:0;z-index:2;pointer-events:none}
#leaders{position:absolute;inset:0;width:100%;height:100%}
.ptag{position:absolute;pointer-events:auto;height:26px;width:104px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:11px;white-space:nowrap}
.ptag span{font-size:9px;opacity:.75;overflow:hidden;text-overflow:ellipsis}
.ptag.f{background:rgba(12,23,24,.88);border:1px solid #2d6068;color:#9fe6ee}
.ptag.w{background:rgba(22,18,11,.88);border:1px solid #6a4a20;color:#f0c080}
.ptag.on{background:var(--fire);border-color:var(--fire);color:#1a1006;font-weight:700}
.ptag.on span{opacity:1}
.tools{position:absolute;left:calc(18% - 50px);top:calc(53% + 22px);display:flex;flex-wrap:wrap;gap:4px;width:104px;pointer-events:auto}
.tools button{flex:1 1 44px;padding:0 4px}
.tools button{height:26px;background:rgba(14,18,17,.85);border:1px solid #3a4540;color:#aeb8b3;font-size:11px;letter-spacing:1px}
.stamp{position:absolute;right:10px;top:10px;text-align:right;font-family:var(--sten);font-size:10px;line-height:1.35;color:var(--khaki);opacity:.55;letter-spacing:2px}
.stamp b{display:inline-block;border:1px solid var(--khaki);padding:1px 5px;margin-bottom:2px;font-weight:400}
#gstats{position:absolute;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;padding:7px 10px;background:rgba(10,14,13,.9);border:1px solid var(--line);pointer-events:auto}
.gs{display:flex;flex-direction:column;gap:3px;min-width:0}
.gs .h{display:flex;justify-content:space-between;font-size:10px;gap:6px}.gs .h em{font-style:normal;color:var(--dim);letter-spacing:2px}
.gs .h b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--accent)}.dn{color:#ff6a4c}
.bar{position:relative;height:7px;background:#1a211e;overflow:hidden}.bar i{position:absolute;top:0;bottom:0}
.b-core{background:var(--accent)}.b-sub{background:#4f7c42}.b-mob{background:var(--cyan)}.b-pen{background:repeating-linear-gradient(45deg,#ff5a3c 0 3px,#5a2014 3px 6px)}
.b-prev{background:rgba(255,255,255,.28)}.b-load{background:var(--accent)}.b-load.warn{background:#f0c040}.b-load.over{background:var(--alert)}

/* 右：情報パネル */
#side{min-height:0;min-width:0;overflow-y:auto;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.shd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.shd .code{font-family:var(--sten);font-size:12px;color:var(--fire);letter-spacing:3px}
.shd .ttl{font-family:var(--disp);font-size:18px;color:#eef2ef}
.shd .sub{font-size:11px;color:var(--dim)}
.rule{height:1px;background:linear-gradient(90deg,var(--fire) 0 60px,var(--line) 60px);flex-shrink:0}
.cols2{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:520px){.cols2{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{min-height:46px;padding:5px 10px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line)}
.pitem .r{display:flex;width:100%;justify-content:space-between;font-size:10px;color:var(--dim)}
.pitem .n{font-family:var(--disp);font-size:13px}
.pitem .eq{color:var(--accent)}
.pitem.sel{background:#1f170b;border-color:var(--fire);color:#ffe2b8;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.pitem.sel .r{color:var(--fire)}
.pitem.lock{border-style:dashed;color:var(--faint);background:transparent}
.detail{padding:10px 12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:7px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.detail .en{font-family:var(--sten);font-size:11px;color:var(--fire);letter-spacing:2px}
.detail .nm{font-family:var(--disp);font-size:17px;color:#eef2ef}
.detail p{margin:0;font-size:11px;color:#9aa6a0;line-height:1.55;font-family:var(--body)}
.sec{font-size:10px;color:var(--dim);letter-spacing:2px;border-bottom:1px solid var(--line);padding-bottom:3px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto 1.2em auto;gap:3px 8px;font-size:11px;align-items:baseline;font-variant-numeric:tabular-nums}
.cmp .k{color:var(--dim)}.cmp .a{text-align:right}.cmp .ar{color:var(--faint);text-align:center}.cmp .b{text-align:right;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:4px}
.btn-main{flex:1;height:36px;background:var(--fire);border:0;color:#1a1006;font-size:13px;font-weight:700;letter-spacing:3px}
.btn-sub{height:36px;padding:0 14px;background:transparent;border:1px solid #3a4540;color:#aeb8b3;font-size:12px}
.warn-msg{font-size:11px;color:var(--alert);line-height:1.5;font-family:var(--body)}
.ovl{display:flex;flex-direction:column;gap:4px}
.orow{display:grid;grid-template-columns:4.5em minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);text-align:left;font-size:12px}
.orow .k{font-size:10px;letter-spacing:1px}.orow .k.f{color:#9fe6ee}.orow .k.w{color:#f0c080}
.orow .v{font-family:var(--disp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.orow .wt{font-size:10px;color:var(--dim)}
.note{font-size:11px;color:var(--dim);line-height:1.6;font-family:var(--body)}
.note em{font-style:normal;color:var(--fg)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.colrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.colrow label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);background:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--fire);color:#1a1006;border-color:var(--fire)}

/* 読みやすさとスクロールなしのための調整 */
#side{overflow:hidden;gap:8px;padding:10px 12px}
@media (orientation:portrait){#side{overflow-y:auto}}
.shd .sub{font-size:12px;color:#aab6b0}
.cols2{grid-template-columns:minmax(0,10.5em) minmax(0,1fr);flex:1;min-height:0}
.plist{gap:4px}
.pitem{min-height:0;height:40px;padding:0 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:6px;row-gap:1px;align-content:center}
.pitem .pc{grid-column:1/-1;font-family:var(--mech);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--khaki);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pc small{font-family:var(--body);font-weight:400;letter-spacing:0;color:var(--dim);margin-left:6px;font-size:10px}
.pitem.sel .pc{color:var(--fire)}
.pitem .c{font-size:10px;color:var(--dim)}.pitem .n{font-family:var(--disp);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .t{font-size:10px;color:var(--dim)}.pitem .t.eq{color:var(--accent)}.pitem.sel .c,.pitem.sel .t{color:var(--fire)}
.detail{gap:6px;padding:8px 10px;min-height:0}
.dtop{display:flex;gap:10px;align-items:flex-start}
.pv{width:124px;height:84px;flex-shrink:0;background:#070a09;border:1px solid var(--line);position:relative}
.pv::after{content:"PREVIEW";position:absolute;left:4px;top:2px;font-family:var(--sten);font-size:8px;color:var(--khaki);letter-spacing:2px;opacity:.7}
.pv canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.dtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.detail p{font-size:12px;color:#b3beb8;line-height:1.45}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px}
.cmp .c{display:flex;justify-content:space-between;gap:6px;font-size:12px;border-bottom:1px dotted #26302c;padding-bottom:1px;white-space:nowrap;min-width:0}
.cmp .k{color:#98a59f}.cmp .v{font-variant-numeric:tabular-nums}.cmp .v i{font-style:normal;color:var(--faint);margin:0 3px}
.sec{font-size:11px;color:#98a59f}
.ovl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.orow{padding:6px 8px;grid-template-columns:3.6em minmax(0,1fr);font-size:13px}
.orow .wt{display:none}
.orow .vc{margin-left:6px;font-family:var(--body);font-size:10px;color:var(--dim)}
.note{font-size:12px;color:#aab6b0}
.gs .h{font-size:11px}.gs .h em{color:#98a59f}
.ptag{transform:translate(-50%,-50%);width:100px;height:30px;font-size:12px}
.ptag span{font-size:10px}
#camBtn{position:absolute;right:16px;top:calc(46px + env(safe-area-inset-top,0px));font-size:12px;padding:5px 10px}
#score{top:calc(84px + env(safe-area-inset-top,0px))}

#modal{position:fixed;inset:0;z-index:25;background:rgba(4,6,5,.7);display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--fire);padding:12px 14px;display:flex;flex-direction:column;gap:8px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
/* 装備ボタンを常に下端に */
#side{height:100%;box-sizing:border-box}
.cols2{align-items:stretch}
.plist{min-height:0;overflow:hidden}
.detail{min-height:0;overflow:hidden}
.detail .acts{margin-top:auto;flex-shrink:0}
.detail .cmp{flex-shrink:1;min-height:0;overflow:hidden}
.dtop{flex-shrink:0}
.detail p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pitem:disabled{opacity:.45}.pitem .t.ov{color:var(--alert)}
#reticle{display:none}
/* ===== 英語表記・ゲージの見た目 ===== */
.en{font-family:var(--mech);letter-spacing:.08em}
.shd .ttl.en{font-size:18px;font-weight:700;letter-spacing:.14em}
.detail .en{font-family:var(--mech)!important;letter-spacing:.12em}
.secj{margin-left:8px;letter-spacing:0;color:var(--faint);font-family:var(--body)}
.orow .k{font-family:var(--mech);letter-spacing:.14em}
.sec{font-family:var(--disp)}
.cmp .k{font-size:11px;font-family:var(--disp)}
.orow .v{font-family:var(--disp);font-size:13px}
.pitem .n{font-family:var(--disp);font-size:13px;letter-spacing:.02em}
.ptag{font-family:var(--mech);letter-spacing:.1em;font-weight:700}
.ptag span{font-weight:500;letter-spacing:.04em}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.specs span{display:flex;flex-direction:column;padding:4px 8px;background:var(--panel2);border-left:2px solid var(--olive)}
.specs small{font-size:10px;color:var(--dim)}.specs b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}.specs i{font-style:normal;font-size:10px;color:var(--dim);margin-left:2px}
.mitem .t.en{font-family:var(--mech);font-weight:700;letter-spacing:.16em;font-size:14px}
.mitem{min-height:52px}
.mitem .t.en small{color:var(--dim);font-size:10px;margin-top:2px;display:block;font-family:var(--body);letter-spacing:0;font-weight:400}
.tools button{font-family:var(--mech);font-weight:700;letter-spacing:.08em;font-size:10px}
#gstats{gap:6px 16px;padding:8px 12px 7px;background:linear-gradient(180deg,rgba(14,19,17,.94),rgba(8,11,10,.94));border:1px solid #34403a;border-top:2px solid var(--olive)}
#gstats::before{content:"STATUS";position:absolute;right:10px;top:-9px;padding:0 6px;background:#0b0e0d;font-family:var(--sten);font-size:10px;letter-spacing:3px;color:var(--khaki)}
.gs{gap:3px}
.gh{display:flex;align-items:baseline;gap:8px}
.gl{font-size:12px;color:var(--khaki);font-weight:700;min-width:6.5em;font-family:var(--disp)!important;letter-spacing:.06em!important}
.gf{font-family:var(--body)!important;letter-spacing:0!important;font-size:10px!important;color:#7f8c86!important}
.gv{font-family:var(--mech);font-size:17px;font-weight:700;color:#eef2ef;font-variant-numeric:tabular-nums;line-height:1}
.gv small{font-size:10px;color:var(--dim);margin-left:3px;font-weight:500}
.dchip{margin-left:auto;font-family:var(--mech);font-size:11px;font-weight:700;padding:0 5px;border:1px solid currentColor;line-height:15px}
.cells{display:grid;grid-template-columns:repeat(28,minmax(0,1fr));gap:2px;height:9px}
.cells i{background:#18201c;transform:skewX(-24deg)}
.cells i.c-core{background:var(--accent);box-shadow:0 0 4px rgba(140,240,110,.5)}.cells i.c-sub{background:#4f7c42}
.cells i.c-mob{background:var(--cyan);box-shadow:0 0 4px rgba(111,211,224,.45)}
.cells i.c-pen{background:transparent;outline:1px solid #ff5a3c;outline-offset:-1px}
.cells i.c-load{background:#b8c890}.cells i.c-warn{background:#e0b040}.cells i.c-over{background:var(--alert)}
.cells i.gu{outline:1px dashed var(--accent);outline-offset:-1px}.cells i.gd{opacity:.35}
.gf{font-family:var(--mech);font-size:9px;letter-spacing:.12em;color:var(--faint)}
.gs .h,.gs .bar{display:none}
/* 兵装の階層リスト */
.pitem.cat .t{color:var(--fire)}.pitem.hascur{border-color:#4f7c42}
.pitem.catback{background:#141a17;border-color:#3a4540;border-left:3px solid var(--fire)}
.pitem.catback .pc{color:var(--fire)}.pitem.catback .n small{font-family:var(--body);font-size:10px;color:var(--dim);margin-left:4px}
/* 種類の行 */
.pitem.cat{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto}
.pitem.cat .cn{font-family:var(--mech);font-weight:700;font-size:14px;letter-spacing:.1em;color:#eef2ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem.cat .cj{grid-row:2;font-size:10px;color:var(--dim);font-family:var(--body)}
.pitem.cat .t{grid-row:1/3;grid-column:2}
.pitem.ovw .n{color:var(--dim)}
/* 部位ボタンの領域：性能パネルの上だけを使う（高さは JS で --gsh に設定） */
#tagzone{position:absolute;left:0;right:0;top:0;bottom:var(--gsh,120px);pointer-events:none}
#tags{position:absolute;inset:0}
.tools{top:calc(53% + 20px)}
@media (max-height:520px){
 .ptag{width:86px;height:24px;font-size:10px;padding:0 6px}.ptag span{font-size:9px}
 .tools{width:88px;left:calc(18% - 43px);top:calc(53% + 16px)}.tools button{height:22px;font-size:9px}
 #gstats{gap:3px 12px;padding:5px 10px 4px}.gf{display:none}.gv{font-size:14px}.gl{font-size:11px!important}.cells{height:7px}
 .pitem{height:36px}.pitem.cat .cn{font-size:13px}
}
/* メニュー */
#menu{position:fixed;inset:0;z-index:20;background:rgba(4,6,5,.6)}
#menu .drawer{position:absolute;right:0;top:0;bottom:0;width:min(320px,86vw);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));box-sizing:border-box;background:#101513;border-left:2px solid var(--fire);display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.mhd{display:flex;justify-content:space-between;align-items:center}
.mhd span{font-family:var(--sten);font-size:13px;color:var(--fire);letter-spacing:4px}
.mitem{min-height:44px;padding:0 14px;display:flex;align-items:center;gap:12px;background:#151b19;text-align:left}
.mitem .no{font-family:var(--sten);font-size:11px;color:var(--fire);letter-spacing:2px;width:40px}
.mitem .t{font-family:var(--disp);font-size:14px;flex:1}.mitem small{font-size:9px;color:var(--faint);letter-spacing:1px}
.mitem.big{min-height:52px;background:var(--fire);color:#1a1006;border:0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.mitem.big .no{color:#1a1006}.mitem.big small{color:#3a2408}
.mfoot{margin-top:auto;display:flex;justify-content:space-between;font-family:var(--sten);font-size:10px;color:var(--faint);letter-spacing:1px}

/* ===== 出撃画面 ===== */
#play{position:absolute;inset:0;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--disp);color:var(--accent);text-shadow:1px 1px 0 #000}
.gauges{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:auto 150px auto;gap:4px 8px;align-items:center;font-size:12px;pointer-events:none}
.gauge{height:9px;border:1px solid currentColor;padding:1px}
.gauge i{display:block;height:100%;background:currentColor}
#apG{color:var(--accent)} #bsG{color:#6fc8ff}
#bsG.low{color:var(--alert)}
.num{font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
#score{position:absolute;right:16px;top:calc(48px + env(safe-area-inset-top,0px));font-size:12px;pointer-events:none;font-variant-numeric:tabular-nums}
#garage{position:absolute;right:16px;top:calc(10px + env(safe-area-inset-top,0px));font-size:12px;padding:5px 10px}
#modeBadge{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--sten);font-size:12px;letter-spacing:4px;color:var(--khaki);border:1px solid var(--khaki);padding:2px 10px;pointer-events:none}
#reticle{position:absolute;left:50%;top:44%;width:26px;height:26px;margin:-13px 0 0 -13px;border:1px solid rgba(140,240,110,.6);pointer-events:none}
#reticle::before,#reticle::after{content:"";position:absolute;background:rgba(140,240,110,.7)}
#reticle::before{left:12px;top:-6px;width:1px;height:38px}#reticle::after{top:12px;left:-6px;height:1px;width:38px}
#lock{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:2px solid var(--alert);pointer-events:none;color:var(--alert);font-size:11px}
#lock span{position:absolute;left:0;top:-16px;white-space:nowrap}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:22px;color:var(--fire);letter-spacing:.2em;pointer-events:none}
#stickArea{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:200px;height:200px;pointer-events:none}
#stick{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border:2px solid rgba(140,240,110,.35);border-radius:50%;pointer-events:none}
.qb{position:absolute;background:rgba(111,200,255,.22);pointer-events:auto;touch-action:none;border:0;padding:0}
.qb.on{background:rgba(111,200,255,.85)}
.qb[data-d=u]{left:82px;top:0;width:36px;height:40px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.qb[data-d=d]{left:82px;bottom:0;width:36px;height:40px;clip-path:polygon(0 0,100% 0,50% 100%)}
.qb[data-d=l]{left:0;top:82px;width:40px;height:36px;clip-path:polygon(0 50%,100% 0,100% 100%)}
.qb[data-d=r]{right:0;top:82px;width:40px;height:36px;clip-path:polygon(0 0,100% 50%,0 100%)}
@media (pointer:fine){#stickArea{display:none}}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(140,240,110,.35)}
#stick.dash{border-color:rgba(111,200,255,.8)}#stick.dash #knob{background:rgba(111,200,255,.55)}
.pbtns{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:186px;height:186px}
.pbtn{position:absolute;width:74px;height:74px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--disp);font-size:13px;line-height:1.1;background:linear-gradient(to top,rgba(111,200,255,.4) var(--rl,0%),rgba(20,24,22,.55) var(--rl,0%));border:2px solid rgba(214,220,216,.35);color:var(--fg);touch-action:none}
.pbtn small{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;max-width:70px;overflow:hidden;white-space:nowrap}
.pbtn.empty{color:var(--dim)}.pbtn.empty small{color:#6fc8ff}
#lock2{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:2px dashed var(--fire);pointer-events:none}
.mark{position:absolute;width:0;height:0;margin:-6px 0 0 -6px;border:6px solid transparent;border-top:9px solid var(--alert);pointer-events:none}
#guardMsg{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:12px;color:#6fc8ff;pointer-events:none}
.pbtn.on{background:rgba(240,160,64,.55);border-color:var(--fire)}
#bR{right:0;top:56px}#bL{left:0;top:56px}#bS{left:56px;top:0}#bJ{left:56px;bottom:0;border-color:rgba(111,200,255,.6)}
#pcHelp{position:absolute;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--dim);line-height:1.6;pointer-events:none;max-width:50%}
@media (pointer:coarse){#pcHelp{display:none}}

<script type="module">
import * as THREE from 'three';

const W=document.getElementById('wrap');
const R=new THREE.WebGLRenderer({antialias:false});R.setPixelRatio(1);W.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x1a1e1c);S.fog=new THREE.Fog(0x1a1e1c,12,28);
const C=new THREE.PerspectiveCamera(40,1,.1,80);
S.add(new THREE.AmbientLight(0x707a80,2.2));
const key=new THREE.DirectionalLight(0xfff0d8,2.8);key.position.set(4,8,5);S.add(key);
const rim=new THREE.DirectionalLight(0x9fb8ff,1.0);rim.position.set(-5,3,-6);S.add(rim);

/* ===== 素材 ===== */
const snap={value:new THREE.Vector2(320,240)},jitOn={value:1};
function psMat(color,extra={}){
 const m=new THREE.MeshLambertMaterial(Object.assign({color,flatShading:true},extra));
 m.onBeforeCompile=sh=>{sh.uniforms.uSnap=snap;sh.uniforms.uJit=jitOn;
  sh.vertexShader='uniform vec2 uSnap;uniform float uJit;\n'+sh.vertexShader.replace('#include <project_vertex>',
  '#include <project_vertex>\nif(uJit>.5){vec4 p=gl_Position;p.xyz/=p.w;p.xy=floor(p.xy*uSnap*.5+.5)/(uSnap*.5);p.xyz*=gl_Position.w;gl_Position=p;}');};
 return m;
}
function tex(draw){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');draw(g);
 const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;return t;}
const panel=(b,l)=>tex(g=>{g.fillStyle=b;g.fillRect(0,0,16,16);g.fillStyle=l;g.fillRect(0,0,16,1);g.fillRect(0,0,1,16);g.fillRect(10,3,1,10);g.fillRect(3,11,5,1);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(1,1,14,1)});
const stripes=(b,f)=>tex(g=>{g.fillStyle=b;g.fillRect(0,0,16,16);g.fillStyle=f;for(let i=-16;i<16;i+=6){g.beginPath();g.moveTo(i,16);g.lineTo(i+3,16);g.lineTo(i+19,0);g.lineTo(i+16,0);g.fill()}});
// フレーム用（色変更できるよう灰色の模様にして、material.color で着色）
const M={
 main:psMat(0xffffff,{map:panel('#e4e4e4','#6a6a6a')}),
 sub:psMat(0xffffff,{map:panel('#e4e4e4','#6a6a6a')}),
 frame:psMat(0xffffff),
 warn:psMat(0xffffff,{map:stripes('#1c1d1f','#ffffff')}),
 dark:psMat(0x17191b),
 vent:psMat(0xffffff,{map:tex(g=>{g.fillStyle='#2b2f33';g.fillRect(0,0,16,16);g.fillStyle='#0e1012';for(let y=2;y<16;y+=3)g.fillRect(2,y,12,1)})}),
 eye:new THREE.MeshBasicMaterial({color:0xffffff}),
};
// 兵装用（色固定）
const Wp={
 body:psMat(0xffffff,{map:panel('#4a4f45','#2a2d26')}),frame:psMat(0x2a2d30),dark:psMat(0x17191b),metal:psMat(0x9aa0a6),
 warn:psMat(0xffffff,{map:stripes('#1c1d1f','#d8741e')}),
 pods:psMat(0xffffff,{map:tex(g=>{g.fillStyle='#4a5057';g.fillRect(0,0,16,16);g.fillStyle='#0b0c0e';for(let i=0;i<3;i++)for(let j=0;j<2;j++)g.fillRect(2+i*5,3+j*6,3,4)})}),
 glow:new THREE.MeshBasicMaterial({color:0xffa040}),
};
// ソケット（取付部）用：無骨で派手な色固定
const Sk={
 plate:psMat(0xffffff,{map:panel('#454b50','#1e2124')}),
 hazard:psMat(0xffffff,{map:stripes('#23281d','#56623e')}),
 bolt:psMat(0xd0d4d8),
 lamp:new THREE.MeshBasicMaterial({color:0xff3020}),
};
function box(p,w,h,d,mat,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);p.add(m);return m}
function cyl(p,r1,r2,h,mat,x,y,z,rx=0,rz=0,s=6){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s),mat);m.position.set(x,y,z);m.rotation.set(rx,0,rz);p.add(m);return m}
function grp(p,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g}

/* ===== カラーリング ===== */
const COLOR_KEYS=[['main','MAIN'],['sub','SUB'],['joint','JOINT'],['line','LINE'],['eye','EYE']];
const PRESETS={
 'STANDARD':{main:'#737a80',sub:'#4a4f45',joint:'#25282c',line:'#d8741e',eye:'#8cf06e'},
 'DESERT':{main:'#b59b6d',sub:'#7a6a4a',joint:'#3a3228',line:'#c0402a',eye:'#ffd060'},
 'ARCTIC':{main:'#d8dde0',sub:'#8a96a0',joint:'#2a3038',line:'#2a78d8',eye:'#60e0ff'},
 'CRIMSON':{main:'#8e2e26',sub:'#bdb6a3',joint:'#2b2d31',line:'#c39640',eye:'#55e0ff'},
 'NIGHT':{main:'#2e3238',sub:'#1c1f24',joint:'#101214',line:'#8a1c1c',eye:'#ff4040'},
};
const COL={...PRESETS['STANDARD']};
function applyColors(){M.main.color.set(COL.main);M.sub.color.set(COL.sub);M.frame.color.set(COL.joint);M.warn.color.set(COL.line);M.eye.color.set(COL.eye);}

/* ===== ソケット（取付部） ===== */
function mountShoulder(g){ // 肩ハードポイント
 box(g,.8,.16,1.0,Sk.plate,0,0,0);
 [-1,1].forEach(q=>{
  box(g,.08,.34,1.02,Sk.hazard,q*.43,.04,0);               // 側面の警告板
  box(g,.12,.14,.92,Sk.bolt,q*.2,.14,0);                    // レール
  [-1,1].forEach(r=>{box(g,.2,.22,.16,Sk.plate,q*.3,.15,r*.44);cyl(g,.045,.045,.07,Sk.bolt,q*.3,.3,r*.44)}); // クランプ＋ボルト
 });
 for(let i=0;i<5;i++)cyl(g,.03,.03,.04,Sk.bolt,-.3+i*.15,.09,.46);   // リベット
 box(g,.34,.4,.34,Sk.plate,0,-.24,-.08);box(g,.36,.07,.36,Sk.hazard,0,-.12,-.08); // 支柱
 box(g,.12,.09,.12,Sk.lamp,0,.13,-.54);                     // 警告灯
 return grp(g,0,.24,0);
}
function mountExt(g){ // 背面ハードポイント
 box(g,1.3,.56,.16,Sk.plate,0,0,0);
 [-1,1].forEach(q=>{box(g,1.32,.08,.18,Sk.hazard,0,q*.28,0);box(g,.22,.72,.3,Sk.plate,q*.58,0,-.08);
  [-1,1].forEach(r=>cyl(g,.045,.045,.07,Sk.bolt,q*.58,r*.26,-.25,Math.PI/2));box(g,.1,.1,.1,Sk.lamp,q*.58,.42,-.08)});
 return grp(g,0,0,-.12);
}
function mountHand(hand){ // 手首の武器ラッチ
 box(hand,.4,.08,.4,Sk.hazard,0,-.24,0);[-1,1].forEach(q=>cyl(hand,.035,.035,.06,Sk.bolt,q*.2,-.24,.12,Math.PI/2));
 return grp(hand,0,-.3,.05);
}

/* ===== パーツカタログ =====
 ・LEGS : 腰と脚。legs[{th,kn,ft,s}] を返す。足首ftの原点から足裏まで0.24（SOLE）を守る
 ・CORE : 胴体。取付点 {neck, arm, shoulder, ext} を返す
 ・HEAD / ARMS : 取付点に付く。ARMSは{el,hand}を返す
 ・兵装は build() で形を作り、{muzzle など} を返す。動き（act）は兵装側に持たせ、
   どのフレームでも共通の関節（肩・肘・胴・脚）だけを動かす
 機体の向きは+Z、機体の右は-X（s=-1） */
const LEGS={
 'LG-01':{name:'LG-01 中量二脚',armor:250,mob:80,wt:45,build(hip){
  box(hip,.95,.45,.75,M.frame,0,0,0);box(hip,.6,.45,.3,M.sub,0,-.1,.4,-.25);
  return [-1,1].map(s=>{
   box(hip,.35,.6,.75,M.main,s*.6,-.2,0,0,0,s*.1);
   const th=grp(hip,s*.6,-.2,0);cyl(th,.2,.2,.4,M.frame,0,0,0,0,Math.PI/2);
   box(th,.36,1.2,.4,M.frame,0,-.65,0);box(th,.56,.8,.66,M.main,0,-.45,.04);box(th,.58,.08,.68,M.warn,0,-.1,.04);
   const kn=grp(th,0,-1.35,0);
   box(kn,.55,.5,.45,M.sub,0,.08,.34,-.35);box(kn,.86,1.0,.95,M.main,0,-.55,-.05);box(kn,.98,.6,1.05,M.main,0,-1.1,-.05);
   box(kn,.7,.95,.32,M.sub,0,-.55,.46,.12);box(kn,.1,1.0,.97,M.warn,s*.44,-.6,-.05);box(kn,.6,.8,.35,M.vent,0,-.75,-.6);
   box(kn,.3,.25,.3,M.frame,s*.52,-1.05,-.25);
   const ft=grp(kn,0,-1.45,0);
   box(ft,1.05,.32,1.2,M.frame,0,-.08,0);box(ft,1.1,.3,.85,M.sub,0,-.07,.85,.12);box(ft,1.0,.28,.6,M.frame,0,-.1,-.8,-.18);
   box(ft,.9,.25,.8,M.main,0,.18,.2,.1);[-1,1].forEach(q=>box(ft,.12,.4,.7,M.warn,q*.5,.08,.1));
   return {th,kn,ft,s};
  });
 }},
 'LG-02':{name:'LG-02 重量二脚',armor:350,mob:65,wt:70,build(hip){
  box(hip,1.1,.55,.9,M.frame,0,0,0);box(hip,.8,.5,.35,M.sub,0,-.1,.48,-.25);
  return [-1,1].map(s=>{
   box(hip,.45,.75,.9,M.sub,s*.72,-.25,0,0,0,s*.12);
   const th=grp(hip,s*.72,-.25,0);cyl(th,.26,.26,.5,M.frame,0,0,0,0,Math.PI/2);
   box(th,.48,1.2,.5,M.frame,0,-.65,0);box(th,.8,.9,.85,M.sub,0,-.5,.04);
   const kn=grp(th,0,-1.35,0);
   box(kn,.75,.6,.55,M.main,0,.1,.42,-.3);box(kn,1.15,1.2,1.2,M.sub,0,-.6,-.05);box(kn,1.25,.55,1.3,M.main,0,-1.15,-.05);
   box(kn,.95,.9,.3,M.main,0,-.5,.58,.1);box(kn,.8,.9,.35,M.vent,0,-.7,-.72);
   [-1,1].forEach(q=>box(kn,.1,1.2,1.0,M.warn,q*.6,-.65,-.05));
   const ft=grp(kn,0,-1.45,0);

const L=(a,b,k)=>a+(b-a)*k;
const sm=x=>x*x*(3-2*x);
function kf(u,keys){ // [[u,値],...] をなめらかにつなぐ
 if(u<=keys[0][0])return keys[0][1];
 for(let i=1;i<keys.length;i++){const [u1,v1]=keys[i],[u0,v0]=keys[i-1];if(u<=u1)return L(v0,v1,sm((u-u0)/(u1-u0)))}
 return keys[keys.length-1][1];
}
const env=(u,a,b)=>Math.max(0,Math.min(1,u/a,(1-u)/(1-b)));

 const m=new THREE.Mesh(UB,new THREE.MeshBasicMaterial({color,transparent:true}));
 m.scale.set(size,size,size*len);m.position.copy(pos);S.add(m);
 if(vel)m.lookAt(_q.copy(pos).add(vel));

}

function updateFX(dt){
 for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.age+=dt;const k=f.age/f.life;

   else{f.vel.z+=dt*26*(mode==='play'?0:1);f.vel.y-=dt*4}
   if(mode==='play'&&!f.home&&f.age>.35)f.vel.addScaledVector(new THREE.Vector3(Math.sin(P.yaw),0,Math.cos(P.yaw)),dt*26);
   f.vel.multiplyScalar(1+dt*.6);f.m.position.addScaledVector(f.vel,dt);f.m.lookAt(_q.copy(f.m.position).add(f.vel));
   f.tt+=dt;if(f.tt>.04){f.tt=0;spawn(0x9a9a94,.18,f.m.position,{life:.5,grow:1.5});spawn(0xffa040,.12,f.m.position,{life:.06})}}
  else{
   if(f.vel){f.vel.y-=f.grav*dt;f.m.position.addScaledVector(f.vel,dt);
    if(f.trail){f.tt+=dt;if(f.tt>.03){f.tt=0;spawn(0x8a8a84,f.trail,f.m.position,{life:.4,grow:1.4})}}}
   if(f.ring){const s=f.base+f.grow*k;f.m.scale.set(s,s,s)}
   else if(f.grow){const s=f.base*Math.max(.05,1+f.grow*k);f.m.scale.set(s,s,s*(f.m.scale.z/f.m.scale.x||1))}
   if(f.spin)f.m.rotation.z+=dt*2;
  }
  // 当たり判定
  if(mode==='play'&&f.team&&f.age<f.life){const pos=f.m.position;
   if(f.team==='p'){
    for(const e of ENEMIES){if(!e.alive)continue;if(e.center(_q).distanceTo(pos)<e.r+f.base+.4){hitEnemy(e,f.dmg,pos.clone(),f.imp);if(f.splash)splashAt(pos,f.splash,f.dmg,f.imp,e);f.age=f.life;break}}
    if(f.age<f.life&&pos.y<.05){if(f.splash)splashAt(pos,f.splash,f.dmg,f.imp);f.age=f.life}

 }

/* ===== 機体性能 =====
 装甲＝コア＋アーム＋レッグ／機動＝レッグの値−総重量×0.15／ブースト容量＝コア／積載＝アーム（全兵装の重量の上限）
 機動が高いほど 歩行・ダッシュ・急加速・跳躍 が伸びる */
const WEIGHT_K=.15;
let SS={};
function wOf(cat,id){return cat[id].st?cat[id].st.wt:0}
function statsFor(c){
 const hd=HEADS[c.head],co=CORES[c.core],ar=ARMS[c.arms],lg=LEGS[c.legs];
 const weap=wOf(HAND,c.rHand)+wOf(HAND,c.lHand)+wOf(SHOULDER,c.rShoulder)+wOf(SHOULDER,c.lShoulder)+wOf(EXT,c.ext);
 const parts=hd.wt+co.wt+ar.wt+lg.wt,total=parts+weap,pen=total*WEIGHT_K,mob=Math.max(5,lg.mob-pen);
 const ranges=[HAND[c.rHand],HAND[c.lHand],SHOULDER[c.rShoulder],SHOULDER[c.lShoulder]].map(d=>d.st&&d.st.range||0);
 const radar=c.rShoulder==='RD'||c.lShoulder==='RD';
 return {armor:co.armor+ar.armor+lg.armor,armorCore:co.armor,boost:co.boost,load:ar.load,weap,total,legMob:lg.mob,pen,mob,
  walk:4+mob*.08,dash:12+mob*.15,qb:8+mob*.1,jump:.6+mob*.008,
  lockRange:Math.max(40,...ranges)+(radar?25:0)+(hd.ability==='long'?30:0),cone:radar?.7:.45,multi:hd.ability==='multi',over:weap>ar.load};
}
function calcStats(){SS=statsFor(cfg);renderGarage()}
/* 弾数：兵装ごとに残弾とリロード残り時間を持つ。0になったときだけ自動でリロード */
const AM={};
function stOf(key){const sl=WSLOTS.find(s=>s.key===key);return sl.cat[cfg[key]].st}
function resetAmmo(){WSLOTS.forEach(sl=>{const st=stOf(sl.key);AM[sl.key]={ammo:st?st.ammo:0,rl:0}})}
function ammoReady(key){const a=AM[key],st=stOf(key);if(!st)return false;if(mode!=='play')return true;return a.rl<=0&&a.ammo>0}
function ammoUse(key,n=1){if(mode!=='play')return true;const a=AM[key],st=stOf(key);if(!st)return false;if(a.ammo===INF)return true;
 if(a.rl>0||a.ammo<n)return false;a.ammo-=n;if(a.ammo<=0){a.ammo=0;a.rl=st.reload;if(HOLD[key])HOLD[key]=false}return true}

function buildMech(c){
 builtKey=JSON.stringify(c);
 Object.keys(active).forEach(k=>delete active[k]);
 if(mech){S.remove(mech.bot);mech.bot.traverse(o=>o.geometry&&o.geometry!==UB&&o.geometry.dispose());}
 const bot=grp(S),hip=grp(bot,0,3.24,0);
 const legs=LEGS[c.legs].build(hip);
 const torso=grp(hip,0,.25,0);torso.scale.setScalar(UPPER);
 const so=CORES[c.core].build(torso);
 const head=grp(torso,...so.neck);HEADS[c.head].build(head);
 const weps={},anchors={};
 const arms=[-1,1].map(s=>{
  const sh=grp(torso,s*so.arm[0],so.arm[1],so.arm[2]);
  const {el,hand}=ARMS[c.arms].build(sh,s);
  const hk=s<0?'rHand':'lHand',sk=s<0?'rShoulder':'lShoulder';
  const hm=mountHand(hand),hp=grp(torso,s*so.shoulder[0],so.shoulder[1],so.shoulder[2]);
  weps[hk]=HAND[c[hk]].build(hm,s);anchors[hk]=hm;
  weps[sk]=SHOULDER[c[sk]].build(mountShoulder(hp),s);anchors[sk]=hp;
  if(s>0)anchors.arms=el;
  return {sh,el,s};
 });
 const eg=grp(torso,...so.ext);weps.ext=EXT[c.ext].build(mountExt(eg));anchors.ext=eg;
 anchors.head=grp(head,0,.3,0);anchors.core=grp(torso,.7,1.0,.3);anchors.legs=grp(legs[1].kn,0,-.6,0);
 const flames=[-1,1].map(s=>{const n=grp(torso,s*so.boost[0],so.boost[1],so.boost[2]);
  box(n,.3,.3,.3,M.frame,0,0,.1);cyl(n,.13,.18,.3,Wp.frame,0,0,-.1,Math.PI/2,0,8);cyl(n,.12,.12,.02,Wp.glow,0,0,-.26,Math.PI/2,0,8);
  const f=grp(n,0,0,-.27);f.rotation.x=-Math.PI/2-.35;cyl(f,.02,.15,1,Wp.glow,0,.5,0,0,0,6);f.scale.set(1,.01,1);return f});
 mech={bot,hip,torso,head,arms,legs,weps,flames,anchors};
 if(mode==='play'){bot.position.set(P.pos.x,0,P.pos.z);bot.rotation.y=P.yaw}
 hlMech=null;
}

function run(key,def,side=0){active[key]={def,sl:{side},t0:t,st:{},fired:new Set()}}
// 兵装の発動（出撃中は、硬直中と同じ兵装の動作中は受け付けない）
function trigger(key){
 const sl=WSLOTS.find(s=>s.key===key),def=sl.cat[cfg[key]];
 if(!def.act)return false;
 if(mode==='play'&&(P.stun>0||active[key]||!ammoReady(key)||def.st.kind==='防御'))return false;
 if(active[key])endOf(def)?.(mech.weps[key]);
 run(key,def,sl.side);return true;
}
function fireShoulders(){const a=trigger('rShoulder'),b=trigger('lShoulder'),c=trigger('ext');return a||b||c}
/* 手のボタン：シールドは押している間だけ構え、それ以外は押すと発動 */
const GUARD={'-1':false,'1':false};
// 長押し：押している間、弾が尽きるまで撃ち続ける（HOLD を毎フレーム見て再発動）
const HOLD={rHand:false,lHand:false,sh:false};
function pressHand(side,down){const key=side<0?'rHand':'lHand';
 if(HAND[cfg[key]].st.kind==='防御'&&mode==='play'){GUARD[side]=down;return}
 HOLD[key]=down&&mode==='play';if(down)trigger(key)}
function pressShoulder(down){HOLD.sh=down&&mode==='play';if(down)fireShoulders()}
function tickHold(){
 ['rHand','lHand'].forEach(k=>{if(HOLD[k]&&!active[k])trigger(k)});
 // 肩は攻撃兵装だけ撃ち続ける（レーダーなどの補助は押した瞬間の1回だけ）
 if(HOLD.sh)['rShoulder','lShoulder'].forEach(k=>{const st=stOf(k);if(st&&st.kind==='射撃'&&!active[k])trigger(k)});
}
function jump(){
 if(active.jump)return;
 if(mode==='play'){if(P.stun>0||P.boost<20){if(P.boost<20)say('BOOST 不足',.6);return}P.boost-=20;P.regen=.8}
 run('jump',JUMP);
}

 if(!free){if(P.boost<30){say('BOOST 不足',.6);return}P.boost-=30;P.regen=.8}
 const top=CAMMODE==='top',f=top?new THREE.Vector3(0,0,-1):new THREE.Vector3(Math.sin(P.yaw),0,Math.cos(P.yaw)),r=top?new THREE.Vector3(1,0,0):new THREE.Vector3(-Math.cos(P.yaw),0,Math.sin(P.yaw));
 const dir=f.multiplyScalar(y).add(r.multiplyScalar(x));if(dir.lengthSq()<.01)dir.set(Math.sin(P.yaw),0,Math.cos(P.yaw));
 P.qb={dir:dir.normalize(),u:0,dist:SS.qb*mult};run('qb',QBA);shake=Math.max(shake,.12);
}
let lockT2=null,reveal=0;
function updateLock(){
 const cone=CAMMODE==='top'?Math.PI:SS.cone,range=SS.lockRange,c=[];playerCenter(_p);
 ENEMIES.forEach(e=>{if(!e.alive)return;e.center(_q).sub(_p);const d=_q.length();if(d>range)return;
  let a=Math.atan2(_q.x,_q.z)-camYaw;a=Math.atan2(Math.sin(a),Math.cos(a));const lim=e===lockT?cone*1.5:cone;
  if(Math.abs(a)<lim)c.push([Math.abs(a),e])});
 c.sort((a,b)=>a[0]-b[0]);lockT=c[0]?c[0][1]:null;lockT2=SS.multi&&c[1]?c[1][1]:null;
}

// スティックは左下に固定。上下左右の三角を押すか、スティックから指を滑らせるとその方向へ急加速
function qbHit(x,y){for(const el of qbEls){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return el}return null}
function qbEnter(el){if(el===qbIn)return;qbIn=el;if(el){el.classList.add('on');setTimeout(()=>el.classList.remove('on'),180);quickBoost(...QBDIR[el.dataset.d])}}

 const l=Math.hypot(dx,dy),R0=50;if(l>R0){dx*=R0/l;dy*=R0/l}IN.x=dx/R0;IN.y=-dy/R0;knob.style.transform=`translate(${dx}px,${dy}px)`;
 qbEnter(qbHit(e.clientX,e.clientY))}

 if(e.target.closest('button'))return;
 const rect=play.getBoundingClientRect(),x=e.clientX-rect.left;

  const sd=e.button===0?-1:e.button===2?1:0;if(sd){pressHand(sd,true);mouseDown.side=sd}return}

 if(q&&stickId!==null){qbEnter(q);return}

});
play.addEventListener('pointermove',e=>{

});
const release=e=>{

const hold=(id,fn,up)=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('on');fn()});

hold('bR',()=>pressHand(-1,true),()=>pressHand(-1,false));hold('bL',()=>pressHand(1,true),()=>pressHand(1,false));hold('bS',()=>pressShoulder(true),()=>pressShoulder(false));hold('bJ',jump);
function readInput(dt){
 let x=IN.x,y=IN.y;
 if(keys.size){x=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);y=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}}
 if(keys.has('KeyQ')||keys.has('ArrowLeft'))camYaw+=dt*2.2;if(keys.has('KeyE')||keys.has('ArrowRight'))camYaw-=dt*2.2;
 // スティックを端まで倒し続けるとダッシュ
 if(stickId!==null){IN.stickDash=Math.hypot(IN.x,IN.y)>.9?IN.stickDash+dt:0;stick.classList.toggle('dash',IN.stickDash>.25)}
 return {x,y,dash:keys.has('ShiftLeft')||keys.has('ShiftRight')||IN.stickDash>.25};
}

 if(mode==='play'){
  $('apBar').style.width=(P.ap/P.apMax*100)+'%';$('apNum').textContent=Math.round(P.ap);
  $('bsBar').style.width=(P.boost/SS.boost*100)+'%';$('bsNum').textContent=Math.round(P.boost);$('bsG').classList.toggle('low',P.boost<30);
  $('score').textContent=`撃破 ${P.kills}`;
  const ammoTxt=key=>{const a=AM[key],st=stOf(key);if(!st)return '';if(a.rl>0)return 'RELOAD';return a.ammo===INF?'∞':String(a.ammo)};
  const btn=(id,keysArr,name)=>{const b=$(id);let rl=0,empty=true;keysArr.forEach(k=>{const a=AM[k],st=stOf(k);if(!st)return;if(a.rl>0)rl=Math.max(rl,1-a.rl/st.reload);else empty=false});
   b.style.setProperty('--rl',rl?(rl*100)+'%':'0%');b.classList.toggle('empty',empty&&keysArr.some(k=>stOf(k)));
   $(name).textContent=keysArr.filter(k=>stOf(k)).map(ammoTxt).join('・')||'なし'};
  btn('bR',['rHand'],'nR');btn('bL',['lHand'],'nL');btn('bS',['rShoulder','lShoulder','ext'],'nS');
  $('guardMsg').textContent=(guarding(-1)||guarding(1))?'防御中':'';
  if(lockT2){lockT2.center(_q).project(C);const l2=$('lock2');if(_q.z<1){l2.hidden=false;l2.style.left=((_q.x+1)/2*100)+'%';l2.style.top=((1-_q.y)/2*100)+'%'}else l2.hidden=true}else $('lock2').hidden=true;
  const marks=$('marks');
  if(reveal>0){while(marks.children.length<ENEMIES.length){const d=document.createElement('div');d.className='mark';marks.appendChild(d)}
   ENEMIES.forEach((e,i)=>{const d=marks.children[i];if(!e.alive){d.hidden=true;return}e.center(_q).project(C);
    const behind=_q.z>1;let x=behind?-_q.x:_q.x,y=behind?-1:_q.y;x=Math.max(-.95,Math.min(.95,x));y=Math.max(-.9,Math.min(.9,y));
    d.hidden=false;d.style.left=((x+1)/2*100)+'%';d.style.top=((1-y)/2*100)+'%'})}
  else [...marks.children].forEach(d=>d.hidden=true);
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
  if(lockT){lockT.center(_q).project(C);if(_q.z<1){lockEl.hidden=false;lockEl.style.left=((_q.x+1)/2*100)+'%';lockEl.style.top=((1-_q.y)/2*100)+'%';
   lockTxt.textContent='LOCK '+Math.round(lockT.center(_v).distanceTo(P.pos))+'m'}else lockEl.hidden=true}else lockEl.hidden=true;
 }
});

</script>
