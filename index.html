<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style>

<style>
/* ガレージ：上に3D画面、下にアセンブル用パネル／出撃：3D画面いっぱいに操作UIを重ねる。単一の暗色ルック（初期3Dゲームの計器盤風） */
:root{
 --bg:#0a0c0b; --panel:#141816; --line:#2a312d; --fg:#d6dcd8; --dim:#7f8a84; --accent:#8cf06e; --fire:#f0a040; --alert:#ff5a3c;
 --disp:"DotGothic16","MS Gothic",monospace; --body:"M PLUS 1p","Hiragino Sans",sans-serif;
 color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overscroll-behavior:none}
#wrap{flex:1;min-height:0;position:relative;background:#000;overflow:hidden;touch-action:none}
#wrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.hud{position:absolute;left:16px;top:12px;right:16px;font-family:var(--disp);font-size:11px;color:var(--accent);letter-spacing:.06em;pointer-events:none;text-shadow:1px 1px 0 #000;z-index:2;line-height:1.55}
.hud b{display:block;font-size:17px;color:var(--fg);font-weight:400}
.bar{background:var(--panel);border-top:1px solid var(--line);padding-block:10px;padding-inline:16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{font-family:var(--disp);font-size:12px;color:var(--dim);letter-spacing:.1em;width:4.5em}
button{font-family:var(--disp);font-size:13px;background:#1d2320;color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:6px 11px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#0c160a;border-color:var(--accent)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sortie{background:var(--accent);color:#0c160a;border-color:var(--accent);font-size:15px;padding:8px 18px;letter-spacing:.2em}
.act button{border-color:#5a4020;background:#231c14}
.asm{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.asm h3{grid-column:1/-1;margin:4px 0 0;font-family:var(--disp);font-weight:400;font-size:12px;color:var(--accent);letter-spacing:.12em;border-bottom:1px solid var(--line);padding-bottom:3px}
.asm label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);min-width:0}
select{font-family:var(--disp);font-size:13px;background:#1d2320;color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:5px 6px;width:100%}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px 10px}
.cols label{flex-direction:row;align-items:center;gap:6px}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);background:none;border-radius:2px}
.hint{font-size:12px;color:var(--dim)}
#err{position:absolute;inset:auto 16px 16px 16px;color:#ffb0a0;font-size:13px;z-index:5}
/* 性能表示 */
.stats{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);padding:10px 12px;background:#101311}
.srow{display:grid;grid-template-columns:5.5em 1fr 8.5em;gap:8px;align-items:center;font-size:12px}
.srow b{font-family:var(--disp);font-weight:400;color:var(--dim);letter-spacing:.08em}
.srow .v{font-family:var(--disp);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sbar{position:relative;height:12px;background:#1d2320;border:1px solid var(--line);overflow:hidden}
.sbar i{position:absolute;top:0;bottom:0;left:0}
.seg-core{background:#8cf06e}.seg-sub{background:#4f7c42}.seg-mob{background:#6fc8ff}.seg-base{background:#2c4f63}.seg-pen{background:repeating-linear-gradient(45deg,#ff5a3c 0 3px,#6a2418 3px 6px)}
.seg-boost{background:#6fc8ff}.seg-load{background:#8cf06e}.seg-load.warn{background:#f0c040}.seg-load.over{background:#ff5a3c}
.sline{font-size:12px;color:var(--dim);line-height:1.6}.sline em{font-style:normal;color:var(--fg)}
.over-msg{color:var(--alert);font-size:12px}
#sortie:disabled{background:#3a2a26;color:#a08a84;border-color:#5a3a30}
.wspec{font-size:11px;color:var(--dim);grid-column:1/-1;line-height:1.5}

/* ===== 出撃画面 ===== */
#play{position:absolute;inset:0;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--disp);color:var(--accent);text-shadow:1px 1px 0 #000}
.gauges{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:auto 150px auto;gap:4px 8px;align-items:center;font-size:12px;pointer-events:none}
.gauge{height:9px;border:1px solid currentColor;padding:1px}
.gauge i{display:block;height:100%;background:currentColor}
#apG{color:var(--accent)} #bsG{color:#6fc8ff}
#bsG.low{color:var(--alert)}
.num{font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
#score{position:absolute;right:16px;top:calc(48px + env(safe-area-inset-top,0px));font-size:12px;pointer-events:none;font-variant-numeric:tabular-nums}
#garage{position:absolute;right:16px;top:calc(10px + env(safe-area-inset-top,0px));font-size:12px;padding:5px 10px}
#reticle{position:absolute;left:50%;top:44%;width:26px;height:26px;margin:-13px 0 0 -13px;border:1px solid rgba(140,240,110,.6);pointer-events:none}
#reticle::before,#reticle::after{content:"";position:absolute;background:rgba(140,240,110,.7)}
#reticle::before{left:12px;top:-6px;width:1px;height:38px}#reticle::after{top:12px;left:-6px;height:1px;width:38px}
#lock{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:2px solid var(--alert);pointer-events:none;color:var(--alert);font-size:11px}
#lock span{position:absolute;left:0;top:-16px;white-space:nowrap}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:22px;color:var(--fire);letter-spacing:.2em;pointer-events:none}
#stickArea{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:200px;height:200px;pointer-events:none}
#stick{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border:2px solid rgba(140,240,110,.35);border-radius:50%;pointer-events:none}
.qb{position:absolute;background:rgba(111,200,255,.22);pointer-events:auto;touch-action:none}
.qb.on{background:rgba(111,200,255,.85)}
.qb[data-d=u]{left:82px;top:0;width:36px;height:40px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.qb[data-d=d]{left:82px;bottom:0;width:36px;height:40px;clip-path:polygon(0 0,100% 0,50% 100%)}
.qb[data-d=l]{left:0;top:82px;width:40px;height:36px;clip-path:polygon(0 50%,100% 0,100% 100%)}
.qb[data-d=r]{right:0;top:82px;width:40px;height:36px;clip-path:polygon(0 0,100% 50%,0 100%)}
@media (pointer:fine){#stickArea{display:none}}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(140,240,110,.35)}
#stick.dash{border-color:rgba(111,200,255,.8)}#stick.dash #knob{background:rgba(111,200,255,.55)}
.pbtns{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:186px;height:186px}
.pbtn{position:absolute;width:74px;height:74px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;line-height:1.1;background:linear-gradient(to top,rgba(111,200,255,.4) var(--rl,0%),rgba(20,24,22,.55) var(--rl,0%));border:2px solid rgba(214,220,216,.35);color:var(--fg);touch-action:none}
.pbtn small{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;max-width:70px;overflow:hidden;white-space:nowrap}
.pbtn.empty{color:var(--dim)}.pbtn.empty small{color:#6fc8ff}
#lock2{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:2px dashed var(--fire);pointer-events:none}
.mark{position:absolute;width:0;height:0;margin:-6px 0 0 -6px;border:6px solid transparent;border-top:9px solid var(--alert);pointer-events:none}
#guardMsg{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:12px;color:#6fc8ff;pointer-events:none}
.pbtn.on{background:rgba(240,160,64,.55);border-color:var(--fire)}
#bR{right:0;top:56px}#bL{left:0;top:56px}#bS{left:56px;top:0}#bJ{left:56px;bottom:0;border-color:rgba(111,200,255,.6)}
#pcHelp{position:absolute;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--dim);line-height:1.6;pointer-events:none;max-width:50%}
@media (pointer:coarse){#pcHelp{display:none}}
</style>

<body>
<div id="wrap">
 <div class="hud" id="hud"></div>
 <div id="play" hidden>
  <div class="gauges">
   <span>装甲</span><div class="gauge" id="apG"><i id="apBar"></i></div><span class="num" id="apNum"></span>
   <span>BOOST</span><div class="gauge" id="bsG"><i id="bsBar"></i></div><span class="num" id="bsNum"></span>

 </div>

</div>
<div class="bar" id="panel">
 <div class="row"><button id="sortie">出撃</button><span class="hint" id="sortieHint">標的機のいる演習場で操作できます</span></div>

 <div class="asm" id="asm"></div>

  <h3>カラーリング（フレームのみ）</h3>

 </div>
 <div class="row"><span class="lbl">画面</span>
  <button id="r0" aria-pressed="true">240p</button><button id="r1" aria-pressed="false">480p</button><button id="r2" aria-pressed="false">高精細</button>
  <button id="jit" aria-pressed="true">頂点ガタつき</button><button id="rot" aria-pressed="true">自動回転</button></div>
 <div class="hint">ドラッグで回転・ホイール／ピンチで拡大</div>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const W=document.getElementById('wrap');
const R=new THREE.WebGLRenderer({antialias:false});R.setPixelRatio(1);W.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x1a1e1c);S.fog=new THREE.Fog(0x1a1e1c,12,28);
const C=new THREE.PerspectiveCamera(40,1,.1,80);
S.add(new THREE.AmbientLight(0x707a80,2.2));
const key=new THREE.DirectionalLight(0xfff0d8,2.8);key.position.set(4,8,5);S.add(key);
const rim=new THREE.DirectionalLight(0x9fb8ff,1.0);rim.position.set(-5,3,-6);S.add(rim);

/* ===== 素材 ===== */
const snap={value:new THREE.Vector2(320,240)},jitOn={value:1};
function psMat(color,extra={}){
 const m=new THREE.MeshLambertMaterial(Object.assign({color,flatShading:true},extra));
 m.onBeforeCompile=sh=>{sh.uniforms.uSnap=snap;sh.uniforms.uJit=jitOn;
  sh.vertexShader='uniform vec2 uSnap;uniform float uJit;\n'+sh.vertexShader.replace('#include <project_vertex>',
  '#include <project_vertex>\nif(uJit>.5){vec4 p=gl_Position;p.xyz/=p.w;p.xy=floor(p.xy*uSnap*.5+.5)/(uSnap*.5);p.xyz*=gl_Position.w;gl_Position=p;}');};
 return m;
}
function tex(draw){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');draw(g);
 const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;return t;}
const panel=(b,l)=>tex(g=>{g.fillStyle=b;g.fillRect(0,0,16,16);g.fillStyle=l;g.fillRect(0,0,16,1);g.fillRect(0,0,1,16);g.fillRect(10,3,1,10);g.fillRect(3,11,5,1);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(1,1,14,1)});
const stripes=(b,f)=>tex(g=>{g.fillStyle=b;g.fillRect(0,0,16,16);g.fillStyle=f;for(let i=-16;i<16;i+=6){g.beginPath();g.moveTo(i,16);g.lineTo(i+3,16);g.lineTo(i+19,0);g.lineTo(i+16,0);g.fill()}});
// フレーム用（色変更できるよう灰色の模様にして、material.color で着色）
const M={
 main:psMat(0xffffff,{map:panel('#e4e4e4','#6a6a6a')}),
 sub:psMat(0xffffff,{map:panel('#e4e4e4','#6a6a6a')}),
 frame:psMat(0xffffff),
 warn:psMat(0xffffff,{map:stripes('#1c1d1f','#ffffff')}),
 dark:psMat(0x17191b),
 vent:psMat(0xffffff,{map:tex(g=>{g.fillStyle='#2b2f33';g.fillRect(0,0,16,16);g.fillStyle='#0e1012';for(let y=2;y<16;y+=3)g.fillRect(2,y,12,1)})}),
 eye:new THREE.MeshBasicMaterial({color:0xffffff}),
};
// 兵装用（色固定）
const Wp={
 body:psMat(0xffffff,{map:panel('#4a4f45','#2a2d26')}),frame:psMat(0x2a2d30),dark:psMat(0x17191b),metal:psMat(0x9aa0a6),
 warn:psMat(0xffffff,{map:stripes('#1c1d1f','#d8741e')}),
 pods:psMat(0xffffff,{map:tex(g=>{g.fillStyle='#4a5057';g.fillRect(0,0,16,16);g.fillStyle='#0b0c0e';for(let i=0;i<3;i++)for(let j=0;j<2;j++)g.fillRect(2+i*5,3+j*6,3,4)})}),
 glow:new THREE.MeshBasicMaterial({color:0xffa040}),
};
// ソケット（取付部）用：無骨で派手な色固定
const Sk={
 plate:psMat(0xffffff,{map:panel('#454b50','#1e2124')}),
 hazard:psMat(0xffffff,{map:stripes('#141414','#f2c21a')}),
 bolt:psMat(0xd0d4d8),
 lamp:new THREE.MeshBasicMaterial({color:0xff3020}),
};
function box(p,w,h,d,mat,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);p.add(m);return m}
function cyl(p,r1,r2,h,mat,x,y,z,rx=0,rz=0,s=6){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s),mat);m.position.set(x,y,z);m.rotation.set(rx,0,rz);p.add(m);return m}
function grp(p,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g}

/* ===== カラーリング ===== */
const COLOR_KEYS=[['main','メイン'],['sub','サブ'],['joint','関節'],['line','ライン'],['eye','アイ']];
const PRESETS={
 '標準':{main:'#737a80',sub:'#4a4f45',joint:'#25282c',line:'#d8741e',eye:'#8cf06e'},
 '砂漠':{main:'#b59b6d',sub:'#7a6a4a',joint:'#3a3228',line:'#c0402a',eye:'#ffd060'},
 '寒冷地':{main:'#d8dde0',sub:'#8a96a0',joint:'#2a3038',line:'#2a78d8',eye:'#60e0ff'},
 '紅':{main:'#8e2e26',sub:'#bdb6a3',joint:'#2b2d31',line:'#c39640',eye:'#55e0ff'},
 '夜間':{main:'#2e3238',sub:'#1c1f24',joint:'#101214',line:'#8a1c1c',eye:'#ff4040'},
};
const COL={...PRESETS['標準']};
function applyColors(){M.main.color.set(COL.main);M.sub.color.set(COL.sub);M.frame.color.set(COL.joint);M.warn.color.set(COL.line);M.eye.color.set(COL.eye);}

/* ===== ソケット（取付部） ===== */
function mountShoulder(g){ // 肩ハードポイント
 box(g,.8,.16,1.0,Sk.plate,0,0,0);
 [-1,1].forEach(q=>{
  box(g,.08,.34,1.02,Sk.hazard,q*.43,.04,0);               // 側面の警告板
  box(g,.12,.14,.92,Sk.bolt,q*.2,.14,0);                    // レール
  [-1,1].forEach(r=>{box(g,.2,.22,.16,Sk.plate,q*.3,.15,r*.44);cyl(g,.045,.045,.07,Sk.bolt,q*.3,.3,r*.44)}); // クランプ＋ボルト
 });
 for(let i=0;i<5;i++)cyl(g,.03,.03,.04,Sk.bolt,-.3+i*.15,.09,.46);   // リベット
 box(g,.34,.4,.34,Sk.plate,0,-.24,-.08);box(g,.36,.07,.36,Sk.hazard,0,-.12,-.08); // 支柱
 box(g,.12,.09,.12,Sk.lamp,0,.13,-.54);                     // 警告灯
 return grp(g,0,.24,0);
}
function mountExt(g){ // 背面ハードポイント
 box(g,1.3,.56,.16,Sk.plate,0,0,0);
 [-1,1].forEach(q=>{box(g,1.32,.08,.18,Sk.hazard,0,q*.28,0);box(g,.22,.72,.3,Sk.plate,q*.58,0,-.08);
  [-1,1].forEach(r=>cyl(g,.045,.045,.07,Sk.bolt,q*.58,r*.26,-.25,Math.PI/2));box(g,.1,.1,.1,Sk.lamp,q*.58,.42,-.08)});
 return grp(g,0,0,-.12);
}
function mountHand(hand){ // 手首の武器ラッチ
 box(hand,.4,.08,.4,Sk.hazard,0,-.24,0);[-1,1].forEach(q=>cyl(hand,.035,.035,.06,Sk.bolt,q*.2,-.24,.12,Math.PI/2));
 return grp(hand,0,-.3,.05);
}

/* ===== パーツカタログ =====
 ・LEGS : 腰と脚。legs[{th,kn,ft,s}] を返す。足首ftの原点から足裏まで0.24（SOLE）を守る
 ・CORE : 胴体。取付点 {neck, arm, shoulder, ext} を返す
 ・HEAD / ARMS : 取付点に付く。ARMSは{el,hand}を返す
 ・兵装は build() で形を作り、{muzzle など} を返す。動き（act）は兵装側に持たせ、
   どのフレームでも共通の関節（肩・肘・胴・脚）だけを動かす
 機体の向きは+Z、機体の右は-X（s=-1） */
const LEGS={
 'LG-01':{name:'LG-01 中量二脚',armor:250,mob:80,wt:45,build(hip){
  box(hip,.95,.45,.75,M.frame,0,0,0);box(hip,.6,.45,.3,M.sub,0,-.1,.4,-.25);

/* ===== 補間・キーフレーム ===== */
const L=(a,b,k)=>a+(b-a)*k;
const sm=x=>x*x*(3-2*x);
function kf(u,keys){ // [[u,値],...] をなめらかにつなぐ
 if(u<=keys[0][0])return keys[0][1];
 for(let i=1;i<keys.length;i++){const [u1,v1]=keys[i],[u0,v0]=keys[i-1];if(u<=u1)return L(v0,v1,sm((u-u0)/(u1-u0)))}
 return keys[keys.length-1][1];
}
const env=(u,a,b)=>Math.max(0,Math.min(1,u/a,(1-u)/(1-b)));
const AIM={x:-1.45,e:-.1}; // 腕を前に構える角度（どの腕パーツでも共通）

 const {vel=null,life=.3,grow=0,fade=true,len=1,spin=false,grav=0,trail=0,team=null,dmg=0,splash=0,imp='なし'}=o;
 const m=new THREE.Mesh(UB,new THREE.MeshBasicMaterial({color,transparent:true}));
 m.scale.set(size,size,size*len);m.position.copy(pos);S.add(m);
 if(vel)m.lookAt(_q.copy(pos).add(vel));
 const f={m,vel:vel&&vel.clone(),life,age:0,grow,fade,base:size,spin,grav,trail,tt:0,team,dmg,splash,imp};FX.push(f);return f;
}
function flash(obj,size,color=0xffe080){obj.getWorldPosition(_p);spawn(color,size,_p,{life:.08,grow:-.5});spawn(0xffffff,size*.5,_p,{life:.05})}
function smoke(pos,n,size){const o=pos.clone();for(let i=0;i<n;i++)spawn(0x6a6a66,size,o.clone().add(new THREE.Vector3((Math.random()-.5)*.6,Math.random()*.4,(Math.random()-.5)*.6)),{vel:new THREE.Vector3((Math.random()-.5),1+Math.random(),(Math.random()-.5)),life:.8+Math.random()*.4,grow:1.2,spin:true})}
// 照準：出撃中でロックオンしていれば標的へ、それ以外は銃口の向き
function aimDir(from,obj,tgt){if(mode==='play'&&tgt&&tgt.alive)return tgt.center(new THREE.Vector3()).sub(from).normalize();return obj.getWorldDirection(new THREE.Vector3())}

 obj.getWorldPosition(_p);const dir=aimDir(_p,obj,tgt);

function melee(range,dmg,imp){if(mode!=='play')return;

 ENEMIES.forEach(e=>{if(!e.alive)return;e.center(_q).sub(P.pos);_q.y=0;const d=_q.length();

function updateFX(dt){
 for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.age+=dt;const k=f.age/f.life;
  if(f.missile){
   if(f.home&&f.home.alive&&f.age>.35){const want=f.home.center(_q).sub(f.m.position).normalize().multiplyScalar(f.vel.length()+dt*20);f.vel.lerp(want,Math.min(1,dt*4))}
   else{f.vel.z+=dt*26*(mode==='play'?0:1);f.vel.y-=dt*4}
   if(mode==='play'&&!f.home&&f.age>.35)f.vel.addScaledVector(new THREE.Vector3(Math.sin(P.yaw),0,Math.cos(P.yaw)),dt*26);
   f.vel.multiplyScalar(1+dt*.6);f.m.position.addScaledVector(f.vel,dt);f.m.lookAt(_q.copy(f.m.position).add(f.vel));
   f.tt+=dt;if(f.tt>.04){f.tt=0;spawn(0x9a9a94,.18,f.m.position,{life:.5,grow:1.5});spawn(0xffa040,.12,f.m.position,{life:.06})}}
  else{
   if(f.vel){f.vel.y-=f.grav*dt;f.m.position.addScaledVector(f.vel,dt);
    if(f.trail){f.tt+=dt;if(f.tt>.03){f.tt=0;spawn(0x8a8a84,f.trail,f.m.position,{life:.4,grow:1.4})}}}
   if(f.ring){const s=f.base+f.grow*k;f.m.scale.set(s,s,s)}
   else if(f.grow){const s=f.base*Math.max(.05,1+f.grow*k);f.m.scale.set(s,s,s*(f.m.scale.z/f.m.scale.x||1))}
   if(f.spin)f.m.rotation.z+=dt*2;
  }
  // 当たり判定
  if(mode==='play'&&f.team&&f.age<f.life){const pos=f.m.position;
   if(f.team==='p'){
    for(const e of ENEMIES){if(!e.alive)continue;if(e.center(_q).distanceTo(pos)<e.r+f.base){hitEnemy(e,f.dmg,pos.clone(),f.imp);if(f.splash)splashAt(pos,f.splash,f.dmg,f.imp,e);f.age=f.life;break}}
    if(f.age<f.life&&pos.y<.05){if(f.splash)splashAt(pos,f.splash,f.dmg,f.imp);f.age=f.life}
   }else if(f.team==='e'){playerCenter(_q);if(_q.distanceTo(pos)<2.0){hitPlayer(f.dmg,f.imp,pos);f.age=f.life}else if(pos.y<.05)f.age=f.life}
  }
  if(f.fade&&f.m.material.transparent)f.m.material.opacity=1-Math.min(1,k);
  if(f.age>=f.life){S.remove(f.m);f.m.material.dispose();if(f.m.geometry!==UB)f.m.geometry.dispose();FX.splice(i,1)}
 }

const WEIGHT_K=.15;

function calcStats(){
 const hd=HEADS[cfg.head],co=CORES[cfg.core],ar=ARMS[cfg.arms],lg=LEGS[cfg.legs];
 const weap=wOf(HAND,cfg.rHand)+wOf(HAND,cfg.lHand)+wOf(SHOULDER,cfg.rShoulder)+wOf(SHOULDER,cfg.lShoulder)+wOf(EXT,cfg.ext);
 const parts=hd.wt+co.wt+ar.wt+lg.wt,total=parts+weap,pen=total*WEIGHT_K,mob=Math.max(5,lg.mob-pen);

 const radar=cfg.rShoulder==='RD'||cfg.lShoulder==='RD';
 SS={armor:co.armor+ar.armor+lg.armor,armorCore:co.armor,boost:co.boost,load:ar.load,weap,total,legMob:lg.mob,pen,mob,
  walk:4+mob*.08,dash:12+mob*.15,qb:8+mob*.1,jump:.6+mob*.008,
  lockRange:Math.max(40,...ranges)+(radar?25:0)+(hd.ability==='long'?30:0),cone:radar?.7:.45,multi:hd.ability==='multi',over:weap>ar.load};

}
function renderStats(){

 const pct=(v,m)=>Math.min(100,v/m*100);

 const hd=HEADS[cfg.head];
 $('stats').innerHTML=
  `<div class="srow"><b>装甲</b>${bar([['seg-sub',0,pct(SS.armor,1400)],['seg-core',0,pct(SS.armorCore,1400)]])}<span class="v">${SS.armor}</span></div>`+
  `<div class="srow"><b>機動</b>${bar([['seg-base',0,pct(SS.legMob,100)],['seg-pen',pct(SS.mob,100),pct(SS.legMob,100)-pct(SS.mob,100)],['seg-mob',0,pct(SS.mob,100)]])}<span class="v">+${SS.legMob} −${Math.round(SS.pen)} = ${Math.round(SS.mob)}</span></div>`+
  `<div class="srow"><b>ブースト容量</b>${bar([['seg-boost',0,pct(SS.boost,130)]])}<span class="v">${SS.boost}</span></div>`+

  `<div class="sline">ヘッド能力：<em>${hd.abName}</em>（${hd.abDesc}）　総重量 ${SS.total}　ロック距離 ${SS.lockRange}m</div>`+

const AM={};

function resetAmmo(){WSLOTS.forEach(sl=>{const st=stOf(sl.key);AM[sl.key]={ammo:st?st.ammo:0,rl:0}})}
function ammoReady(key){const a=AM[key],st=stOf(key);if(!st)return false;if(mode!=='play')return true;return a.rl<=0&&a.ammo>0}
function ammoUse(key,n=1){if(mode!=='play')return true;const a=AM[key],st=stOf(key);if(!st)return false;if(a.ammo===INF)return true;
 if(a.rl>0||a.ammo<n)return false;a.ammo-=n;if(a.ammo<=0){a.ammo=0;a.rl=st.reload}return true}
function tickAmmo(dt){WSLOTS.forEach(sl=>{const a=AM[sl.key];if(a&&a.rl>0){a.rl-=dt;if(a.rl<=0){a.rl=0;a.ammo=stOf(sl.key).ammo}}})}
